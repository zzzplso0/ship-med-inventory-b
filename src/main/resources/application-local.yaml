spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/seed
  mail:
    host: localhost
    port: 1025

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    com.shipmed.shipmed: DEBUG

shipmed:
  initial-admin:
    login-id: local-admin
    email: local-admin@example.com
    name: 로컬 관리자
    password: admin1234!
  notification:
    from: noreply@shipmed.local