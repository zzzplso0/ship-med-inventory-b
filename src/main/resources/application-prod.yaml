server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

shipmed:
  initial-admin:
    login-id: ${ADMIN_LOGIN_ID}
    email: ${ADMIN_EMAIL}
    name: ${ADMIN_NAME}
    password: ${ADMIN_PASSWORD}
  notification:
    from: ${MAIL_USERNAME}