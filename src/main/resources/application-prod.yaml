server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

shipmed:
  initial-admin:
    login-id: ${ADMIN_LOGIN_ID}
    name: ${ADMIN_NAME}
    password: ${ADMIN_PASSWORD}