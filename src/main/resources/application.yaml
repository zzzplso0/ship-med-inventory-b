server:
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  application:
    name: shipmed
  profiles:
    default: local
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 10MB
  flyway:
    locations:
      - classpath:db/migration

mybatis:
  mapper-locations:
    - classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true # expiry_date → expiryDate
    arg-name-based-constructor-auto-mapping: true # record를 생성자 인자 이름으로 매핑.