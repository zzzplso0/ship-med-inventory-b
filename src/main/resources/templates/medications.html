<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('약품')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h1>약품</h1>
    <p class="message" th:if="${message}" th:text="${message}"></p>

    <section sec:authorize="hasRole('ADMIN')">
        <h2>약품 등록</h2>
        <form th:action="@{/medications}" method="post">
            <p>
                <label for="name">이름</label>
                <input type="text" id="name" name="name" th:value="${form?.name}" maxlength="50" required>
                <span class="error" th:if="${fieldErrors?.get('name')}" th:text="${fieldErrors.get('name')}"></span>
            </p>
            <p>
                <label for="category">분류(선택)</label>
                <input type="text" id="category" name="category" th:value="${form?.category}" maxlength="30">
                <span class="error" th:if="${fieldErrors?.get('category')}" th:text="${fieldErrors.get('category')}"></span>
            </p>
            <p>
                <label for="unit">단위</label>
                <input type="text" id="unit" name="unit" th:value="${form?.unit}" maxlength="20" placeholder="정, 앰플 등" required>
                <span class="error" th:if="${fieldErrors?.get('unit')}" th:text="${fieldErrors.get('unit')}"></span>
            </p>
            <button type="submit">등록</button>
        </form>
    </section>

    <h2>약품 목록</h2>
    <p th:text="|총 ${medications.totalElements}개|"></p>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>이름</th>
            <th>분류</th>
            <th>단위</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="medication : ${medications.content}">
            <td th:text="${medication.id}"></td>
            <td th:text="${medication.name}"></td>
            <td th:text="${medication.category} ?: '-'"></td>
            <td th:text="${medication.unit}"></td>
        </tr>
        <tr th:if="${medications.content.isEmpty()}">
            <td colspan="4">약품이 없습니다.</td>
        </tr>
        </tbody>
    </table>
    <nav th:replace="~{fragments/layout :: pagination(${medications}, '/medications')}"></nav>
</main>
</body>
</html>
