name: Deploy

on:
  push:
    tags: [ 'v*' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      TAG: ${{ github.ref_name }}
      IMAGE: shipmed.kr.ncr.ntruss.com/shipmed
      NCP_ACCESS_KEY: ${{ secrets.NCP_ACCESS_KEY }}
      NCP_SECRET_KEY: ${{ secrets.NCP_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 테스트
        run: chmod +x gradlew && ./gradlew build

      - name: 이미지 push
        run: |
          echo "$NCP_SECRET_KEY" | docker login shipmed.kr.ncr.ntruss.com -u "$NCP_ACCESS_KEY" --password-stdin
          docker build -t $IMAGE:${TAG#v} .
          docker push $IMAGE:${TAG#v}

      - name: 배포 파일 업로드
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NCP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NCP_SECRET_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          echo ${TAG#v} > IMAGE_TAG
          zip -j deploy.zip deploy/deploy.sh IMAGE_TAG
          aws s3 cp deploy.zip s3://${{ vars.DEPLOY_BUCKET }}/deploy/deploy.zip \
            --endpoint-url https://kr.object.ncloudstorage.com --region kr-standard

      - name: 배포 요청
        run: |
          URI=/api/v1/project/${{ vars.SD_PROJECT_ID }}/stage/${{ vars.SD_STAGE_ID }}/scenario/${{ vars.SD_SCENARIO_ID }}/deploy
          TS=$(date +%s000)
          SIG=$(printf "POST $URI\n$TS\n$NCP_ACCESS_KEY" | openssl dgst -sha256 -hmac "$NCP_SECRET_KEY" -binary | base64)
          curl -f -X POST https://vpcsourcedeploy.apigw.ntruss.com$URI \
            -H "x-ncp-apigw-timestamp: $TS" \
            -H "x-ncp-iam-access-key: $NCP_ACCESS_KEY" \
            -H "x-ncp-apigw-signature-v2: $SIG"

      - name: Discord 알림
        if: always()
        uses: sarisia/actions-status-discord@v1
        continue-on-error: true
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "배포 결과"
          description: |
            ${{ github.ref_name }}
            by ${{ github.actor }}
