services:
  postgres:
    image: postgres:17
    container_name: shipmed-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - '5432:5432'
    volumes:
      - shipmed-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shipmed-network

  app:
    build: .
    image: shipmed:local
    container_name: shipmed-app
    profiles: [ app ]
    env_file:
      - path: ./shipmed-prod-test.env
        required: false
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shipmed-network

volumes:
  shipmed-db-data:
    name: shipmed-db-data

networks:
  shipmed-network: